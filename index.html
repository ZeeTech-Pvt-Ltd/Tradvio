<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/Tradvio-Icon.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/Tradvio-Icon.png" />
  <link rel="apple-touch-icon" href="/Tradvio-Icon.png" />
  <!-- Geist fonts are self-hosted (see src/index.css) and preloaded here -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-var.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-mono-var.woff2" crossorigin />
  <script>
    /* Lazy-load the Replain chat widget — only downloads after the visitor
       first interacts (scroll/click/touch/keys) or the page is idle for a few
       seconds. Keeps ~100KB off the critical path. */
    window.replainSettings = { id: 'c6366b02-2531-4ee7-b3e1-7cc6f93d7e57' };
    (function () {
      var loaded = false;
      function load() {
        if (loaded) return;
        loaded = true;
        cleanup();
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://widget.replain.cc/dist/client.js';
        var x = document.getElementsByTagName('script')[0];
        x.parentNode.insertBefore(s, x);
      }
      var evts = ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'];
      function onEvent() { load(); }
      function cleanup() {
        for (var i = 0; i < evts.length; i++) window.removeEventListener(evts[i], onEvent);
        if ('cancelIdleCallback' in window) window.cancelIdleCallback(idleId);
        else clearTimeout(idleId);
      }
      for (var i = 0; i < evts.length; i++) window.addEventListener(evts[i], onEvent, { passive: true });
      var idleId = ('requestIdleCallback' in window)
        ? window.requestIdleCallback(load, { timeout: 8000 })
        : setTimeout(load, 8000);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    /* Deferred analytics loader — Google Analytics and Microsoft Clarity start
       only after the page has loaded, so they never compete with the app
       bundle or first paint on slow connections. */
    (function () {
      var started = false;
      function start() {
        if (started) return;
        started = true;
        cleanup();
        // Google Analytics
        var g = document.createElement('script');
        g.async = true;
        g.src = 'https://www.googletagmanager.com/gtag/js?id=G-BLHY0BZWMX';
        document.head.appendChild(g);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-BLHY0BZWMX');
        // Microsoft Clarity
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r); t.async = 1;
          t.src = 'https://www.clarity.ms/tag/' + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, 'clarity', 'script', 'xy1feronjb');
      }
      var timer;
      function onDone() {
        timer = setTimeout(start, 2000);
      }
      function cleanup() {
        window.removeEventListener('load', onDone);
        window.removeEventListener('scroll', start, true);
        window.removeEventListener('touchstart', start, true);
        clearTimeout(timer);
      }
      window.addEventListener('load', onDone);
      window.addEventListener('scroll', start, { passive: true, once: true });
      window.addEventListener('touchstart', start, { passive: true, once: true });
    })();
  </script>
</body>
</html>
